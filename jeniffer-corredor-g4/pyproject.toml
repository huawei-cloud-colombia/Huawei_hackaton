[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_backend"

[project]
name = "sentinelpay"
version = "0.1.0"
description = "SentinelPay Risk Engine - motor de scoring de riesgo para transacciones financieras"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["codigo"]

[tool.pytest.ini_options]
pythonpath = ["codigo"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
